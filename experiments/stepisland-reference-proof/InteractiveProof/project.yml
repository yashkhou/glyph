name: GlyphInteractiveProof
options:
  bundleIdPrefix: com.glyphproof
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GlyphInteractiveProof:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Glyph Proof
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glyphproof.interactive
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  GlyphInteractiveProofUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GlyphInteractiveProof
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glyphproof.interactive.uitests
        TEST_TARGET_NAME: GlyphInteractiveProof
schemes:
  GlyphInteractiveProof:
    build:
      targets:
        GlyphInteractiveProof: all
        GlyphInteractiveProofUITests: [test]
    test:
      targets:
        - GlyphInteractiveProofUITests
