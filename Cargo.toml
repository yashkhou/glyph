[package]
name = "glyph-design"
version = "0.1.0"
edition = "2024"
description = "AI-native semantic visual IR, DSL, constraint compiler and design runtime"
license = "MIT"

[lib]
name = "glyph"
path = "src/lib.rs"

[[bin]]
name = "glyph"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pest = "2"
pest_derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
